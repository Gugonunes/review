[project]
name = "app"
version = "0.1.0"
description = "Live coding interview project."
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

# uv workspace used by SST to package the Lambda in functions/ together with this package.
[tool.uv.workspace]
members = ["functions"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "functions/src"]
addopts = "-q"
